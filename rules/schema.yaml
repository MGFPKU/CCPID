  blank_values:
    allowed_when_unknown:
      - ""
      - "N/A"
      - "Not specified"
    rule: "Use N/A for structurally non-applicable fields, Not specified for true unknowns, and blank only during draft entry."
  canonicalization:
    case_sensitive: false
    export_uses_canonical_values: true
    rules:
      - "Normalize recognized controlled values for casing during validation."
      - "Preserve source spelling in free-text evidence fields."
      - "Treat configured aliases as equivalent to their canonical field names."
  dates:
    type: string
    format: "dd/mm/yyyy"
    fields:
      - Adoption date
      - Start date
      - End date
      - Last revision
      - Last revisions
    rules:
      - "Dates must match dd/mm/yyyy when day and month are available."
      - "Start date should not be earlier than Adoption date unless legally justified in details."
      - "End date should not be earlier than Start date."
      - "End date means the date when the final legal requirement of the mandate takes effect, not necessarily policy expiry."
  urls:
    type: uri
    fields:
      - Legal document
      - Other weblinks
      - Other relevant websites
    rules:
      - "Must be an http or https URL when a web source is provided."
      - "Multiple URLs must be separated by semicolons."
      - "Minimum final-publication source standard is primary legislation or an official government source. Secondary sources are allowed only as temporary support."
      - "Every non-empty factual field should be traceable to Legal statute, Legal document, Other relevant websites, or another source note before final publication."
  numbers:
    type: number_or_formula_text
    fields:
      - Intensity (Value)
      - Intensity (Year)
      - "Tax and Tax Incentive: annual revenue"
      - "Tax and Tax Incentive: annual revenue forgone"
      - "Subsidy: annual budget/ expenditure"
      - "Subsidy: Limit"
      - "Trading System: cap"
      - "Trading System: Free Allowance"
      - "Trading System: revenue (annual)"
      - "Trading System: Volume"
      - "Public investment/procurement: Annual expenditure"
      - GHG emission coverage (absolute)
      - GHG emission coverage (% domestic emissions)
    rules:
      - "Numeric values may include formulas exactly as stated in law."
      - "For market instruments, annual market-operation data should be sourced from operational disclosures before being marked unavailable: regulator statistics/newsletters/press releases/briefings/Q&A, official platform or market-operator bulletins, official industry/system-operator reports, then credible non-official market reports or news."
      - "Do not infer annual transaction value from unmatched total volume and category/vintage average prices. Use calculated values only when the matching quantity and price scope are disclosed."
      - "Distinguish annual from cumulative figures, total transaction value from average price, standalone trades from bundled green-power/certificate trades, and secondary-market transaction value from allocation or auction revenue."
      - "Units, currency, base year, and price year should be captured in the paired unit/detail field."
      - "For tiered rates, ranges, formulas, or thresholds, put the simplest comparable scalar in Intensity (Value) when possible, the measurement unit in Intensity (Unit), and the full formula/table/range in Intensity (Details)."
  multi_value_fields:
    separator: ";"
    rule: "Use semicolon-separated values for multi-select fields."
  dependent_values:
    group_approach_required: true
    rule: "Approach must be valid for the selected Group and Category."
  non_exhaustive_controlled_lists:
    applies_to:
      - Asset
      - Activity
      - Objective
    allow_custom_values: true
    rule: "Allow values outside the source list only when the paired details/other field explains the custom value."
  subscheme_splitting:
    rules:
      - "Split mixed Asset (Status) coverage into subschemes when New and existing assets have different legal requirements."
      - "Allow both New and existing in one row only when the same requirement applies to both."
      - "For national policies with subnational implementation variation, keep Jurisdiction level as national and capture the variation in details or subschemes."
  not_applicable_fields:
    rule: "Use N/A for instrument-specific fields that do not apply to the selected group or approach; do not omit template columns during export."
  instrument_specific_row_splitting:
    rules:
      - "Split public investment and public procurement into separate rows when they are legally or operationally distinct."
      - "Allow one Government I&C row to contain both public investment and public procurement fields when the same instrument genuinely includes both."

