required_fields:
  draft_entry_required:
    - Policy Instrument ID
    - Instrument / subscheme
    - Group
    - Approach
    - Country
    - Jurisdiction level
    - Status
  final_publication_required:
    - Policy Instrument ID
    - Instrument / subscheme
    - Group
    - Approach
    - Country
    - Jurisdiction level
    - Status
    - Legal statute
  inferred_name_at_least_one:
    - Domestic instrument name
    - English instrument name
    - Domestic name
    - English name
  inferred_source_at_least_one:
    - Legal document
    - Other weblinks
    - Other relevant websites
  conditional:
    - rule: "Jurisdiction name is required when Jurisdiction level is supranational, subnational, or special economic zone (SEZ)."
    - rule: "Last revision details are required when a last revision date is provided."
    - rule: "Asset (Other) is required when Asset includes Other."
    - rule: "Activity (Details) is required when Activity needs narrowing beyond the controlled value."
    - rule: "Compliance monitoring details are required when Compliance monitoring is Other or includes a criterion/details placeholder."
    - rule: "Compliance enforcement details are required when Compliance enforcement is Other or penalty/prohibition/order details are needed."
    - rule: "Economic instrument-specific fields apply only to the matching economic instrument group or approach."
    - rule: "Public investment/procurement fields apply only to Government I&C rows."
    - rule: "Information fields apply only to Information instruments rows."
    - rule: "Voluntary approach fields apply only to Voluntary approaches rows."
    - rule: "Legal statute is required before final publication when known. If unavailable, Legal document plus Not specified in Legal statute is acceptable."

global_validation_rules:
  policy_instrument_id:
    pattern: "^[A-Z]{3}[A-Z]{3}[A-Z]{3}I[0-9]{2}S[0-9]{3}$"
    rule: "Policy Instrument ID format is {ISO3 country}{group code}{approach code}I{2-digit instrument sequence}S{3-digit subscheme sequence}."
    examples:
      - "CHNTRAETSI01S000"
      - "CHNTRARECI01S000"
    component_rules:
      - "The country code must match the row country."
      - "The group code must match the selected Group when a group-code mapping is defined."
      - "The approach code must match the selected Approach when an approach-code mapping is defined."
      - "The literal I marks the instrument sequence, as in I01."
      - "Instrument rows use S000; subscheme rows use S001, S002, etc. under the parent stem."
