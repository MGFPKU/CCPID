schema_version: "0.2"
status: resolved_template_governance
sources_read:
  - inputs/template_en.xlsx
  - inputs/template_cn.xlsx
  - inputs/attribute definitions.xlsx
  - inputs/field_dictionary.md
  - inputs/classification structure.md
  - inputs/approaches_en.md
  - inputs/approaches_cn.md
  - inputs/regulated assets and activities.md
  - inputs/IFCMA paper.pdf
notes:
  - "This file defines template structure and validation rules only; it contains no policy data."
  - "The source templates do not explicitly mark required columns. Required fields below distinguish draft-entry requirements from final-publication requirements."
  - "Chinese template headers mirror the English template but source encoding is not normalized here; English headers are canonical."
  - "Validation should normalize recognized values for casing and aliases, while exports should use the canonical display values defined here."

canonical_fields:
  policy_names:
    domestic: Domestic name
    domestic_aliases:
      - Domestic instrument name
    english: English name
    english_aliases:
      - English instrument name
    rule: "At least one policy name is required for draft entry. Domestic name is preferred for China data; English name may be translated later."
  revision:
    canonical: Last revision
    aliases:
      - Last revisions
    details_canonical: Last revision (Details)
    details_aliases:
      - Last revisions (Details)
  mitigation_effect:
    canonical: Mitigation effect
    aliases:
      - Mitigation effects
  other_sources:
    canonical: Other relevant websites
    aliases:
      - Other weblinks

classification_hierarchy:
  - level: 1
    name: Category
    description: "High-level classification based on the policy instrument operating mechanism."
  - level: 2
    name: Group
    description: "Functional grouping of instruments within each category."
  - level: 3
    name: Approach
    description: "Standardized internationally comparable policy approach."
  - level: 4
    name: Instrument
    description: "Specific legal or regulatory measure implemented in a jurisdiction at a given time."
  - level: 5
    name: Sub-scheme
    optional: true
    description: "Variation within a single instrument, such as differentiated requirements, exemptions, or implementation phases."

row_types:
  allowed_values:
    - Instrument
    - Subscheme
  validation:
    - "Use Instrument for the primary policy instrument row."
    - "Use Subscheme only when the row is a policy variation under an existing instrument."

