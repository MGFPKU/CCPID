field_types:
  enum:
    description: "Single value from allowed_values."
  multi_enum:
    description: "One or more values from allowed_values, separated by semicolons."
  string:
    description: "Free text."
  long_text:
    description: "Long free text; should summarize the legal text without adding unsourced interpretation."
  date:
    description: "Date string in dd/mm/yyyy format."
  number:
    description: "Numeric value."
  number_or_formula_text:
    description: "Numeric value or formula/rate expression as stated in the legal source."
  url:
    description: "http or https URL."
  isic_code:
    description: "Economic sector ISIC code, letter plus two digits."

